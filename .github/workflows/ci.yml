name: CI

on:
  pull_request:
  push:
    branches: [preview, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Lint, format, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Authorship
        if: github.event_name == 'pull_request'
        run: scripts/check-authorship.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - run: pnpm lint --max-warnings=0
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm test:unit

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Coverage is measured here, over unit and integration tests together: the
      # transactional services (holds, rentals, references) are covered by tests that need Postgres.
      - run: pnpm test:coverage

  worker:
    name: Worker build and size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm cf:build
      - run: node scripts/check-worker-size.mjs
        env:
          WORKER_MAX_GZIP_KIB: ${{ vars.WORKER_MAX_GZIP_KIB || '3072' }}

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: hotelawise_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: development
      APP_URL: http://localhost:3100
      DATABASE_URL: postgres://postgres@localhost:5432/hotelawise_e2e
      E2E_DATABASE_URL: postgres://postgres@localhost:5432/hotelawise_e2e
      DATABASE_DRIVER: pg
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      REF_SECRET: ci-only-ref-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
