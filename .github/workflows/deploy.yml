name: Deploy

# preview → preview.hotelawise.com, main → hotelawise.com. Each GitHub environment
# holds its own secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, DATABASE_URL_MIGRATE.
on:
  push:
    branches: [preview, main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    env:
      TARGET: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL_MIGRATE: ${{ secrets.DATABASE_URL_MIGRATE }}
    steps:
      - name: Check deploy secrets
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL_MIGRATE; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set for the $TARGET environment"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Migrations run here, before the new code goes live — never on page load.
      - run: pnpm db:migrate
      - run: node scripts/cf-clean-build.mjs --env "$TARGET"
      # The page's font classes must be defined in the CSS it loads (D-56): stop here if not.
      - run: node scripts/check-fonts.mjs
      # Uploads the Worker, populates the KV page cache and creates the D1 tag table.
      - run: pnpm exec opennextjs-cloudflare deploy --env "$TARGET"
      # The same check on the live site: the font mismatch once appeared only once deployed.
      - name: Check fonts on the live site
        run: node scripts/check-fonts.mjs "https://${{ github.ref_name == 'main' && 'hotelawise' || 'hotelawise-preview' }}.wisdomska.workers.dev"
