name: Preview version

# Uploads each PR as a preview version of the preview Worker and comments the URL.
on:
  pull_request:
    branches: [preview]

permissions:
  contents: read
  pull-requests: write

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Repository secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping the preview upload."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.secrets.outputs.ready == 'true'
      - run: node scripts/cf-clean-build.mjs --env preview
        if: steps.secrets.outputs.ready == 'true'
      - id: upload
        if: steps.secrets.outputs.ready == 'true'
        run: |
          out=$(pnpm exec wrangler versions upload --env preview --message "PR #${{ github.event.number }}" 2>&1)
          echo "$out"
          url=$(echo "$out" | grep -oE 'https://[^ ]+\.workers\.dev' | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        if: steps.upload.outputs.url != ''
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Preview version: ${{ steps.upload.outputs.url }}`,
            });
