name: Preview version

# Uploads each PR as a preview version of the preview Worker and comments the URL.
on:
  pull_request:
    branches: [preview]

permissions:
  contents: read
  pull-requests: write

jobs:
  upload:
    runs-on: ubuntu-latest
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm cf:build
      - id: upload
        run: |
          out=$(pnpm exec wrangler versions upload --env preview --message "PR #${{ github.event.number }}" 2>&1)
          echo "$out"
          url=$(echo "$out" | grep -oE 'https://[^ ]+\.workers\.dev' | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        if: steps.upload.outputs.url != ''
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Preview version: ${{ steps.upload.outputs.url }}`,
            });
